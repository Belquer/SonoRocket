# Builds SonoRocket.app for macOS (universal: Apple Silicon + Intel):
# plugin (VST3 + AU) + relay + cloudflared, wrapped in the double-click launcher.
# Signing/notarization run only when the secrets below exist; otherwise the app
# is unsigned and the first open needs "Abrir Mesmo Assim" in System Settings.
#
# Secrets (optional):
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD   Developer ID Application cert
#   MACOS_SIGN_IDENTITY                          e.g. "Developer ID Application: Daniel Belquer (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD  for notarization
name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write   # create the release

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        # every build gets a unique version, so the launcher knows to update the installed plugin
        run: |
          v="0.2.${GITHUB_RUN_NUMBER}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Tools
        run: brew install ninja

      - name: Build plugin (VST3 + AU, universal)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUniversalBinary=ON
          cmake --build build --target SonoBus_VST3 SonoBus_AU -j "$(sysctl -n hw.ncpu)"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: sonorocket/relay/go.sum

      - name: Build relay (universal)
        working-directory: sonorocket/relay
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/relay-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/relay-amd64 .
          lipo -create /tmp/relay-arm64 /tmp/relay-amd64 -output /tmp/rocket-relay

      - name: Fetch cloudflared (universal)
        run: |
          for a in arm64 amd64; do
            curl -fsSL -o /tmp/cf-$a.tgz "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-$a.tgz"
            mkdir -p /tmp/cf-$a && tar -xzf /tmp/cf-$a.tgz -C /tmp/cf-$a
          done
          lipo -create /tmp/cf-arm64/cloudflared /tmp/cf-amd64/cloudflared -output /tmp/cloudflared

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm /tmp/cert.p12

      - name: Notarization credentials
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: xcrun notarytool store-credentials sonorocket --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: Assemble SonoRocket.app
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ env.HAS_NOTARY == 'true' && 'sonorocket' || '' }}
        run: |
          mkdir -p dist
          sonorocket/macos/build-app.sh "${{ steps.v.outputs.version }}" \
            build/SonoBus_artefacts/Release/VST3/SonoRocket.vst3 \
            build/SonoBus_artefacts/Release/AU/SonoRocket.component \
            /tmp/rocket-relay /tmp/cloudflared dist

      - uses: actions/upload-artifact@v4
        with:
          name: SonoRocket-mac
          path: dist/*.zip

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        shell: bash
        run: echo "version=0.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build capture app + VST3
        shell: bash
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSONOROCKET_VERSION="${{ steps.v.outputs.version }}"
          cmake --build build --config Release --target SonoRocketCapture SonoBus_VST3 -- -m

      # Go 1.20 is the last release that still runs on Windows 7/8.1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20"
          cache-dependency-path: sonorocket/relay/go.sum

      - name: Build relay
        shell: bash
        working-directory: sonorocket/relay
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/rocket-relay.exe" .

      - name: Package
        shell: bash
        run: |
          set -e
          OUT="$RUNNER_TEMP/SonoRocket"
          mkdir -p "$OUT" dist
          cp build/SonoRocketCapture_artefacts/Release/SonoRocket.exe "$OUT/"
          cp "$RUNNER_TEMP/rocket-relay.exe" "$OUT/"
          curl -fsSL -o "$OUT/cloudflared.exe" https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
          mkdir -p "$OUT/Plugin (DAWs modernas)"
          cp -r build/SonoBus_artefacts/Release/VST3/SonoRocket.vst3 "$OUT/Plugin (DAWs modernas)/"
          cp sonorocket/windows/LEIA-ME.txt "$OUT/"
          cd "$RUNNER_TEMP" && 7z a -tzip "$GITHUB_WORKSPACE/dist/SonoRocket-windows.zip" SonoRocket >/dev/null
          ls -la "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: SonoRocket-windows
          path: dist/*.zip

  # Each green build on main becomes the latest release, so these links always serve the newest:
  #   https://github.com/Belquer/SonoRocket/releases/latest/download/SonoRocket-windows.zip
  #   https://github.com/Belquer/SonoRocket/releases/latest/download/SonoRocket-mac.zip
  release:
    needs: [mac, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: SonoRocket 0.2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: dist/*.zip
          body_path: sonorocket/RELEASE.md
